    // Parâmetros para cálculo
    const populacaoTotal = 20479140; // População total de MG (Censo 2022)
    const fundoPET = 10610000; // 1% de R$ 1,061 bilhão

    // Função para calcular a contribuição PET
    function calcularContribuicao(populacao) {
      return ((populacao / populacaoTotal) * fundoPET).toFixed(2);
    }

    // Função para formatar números com separador de milhar
    function formatarNumero(numero) {
      return numero.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // Função para preencher a tabela
    function preencherTabela(dados) {
      const tbody = document.getElementById("municipiosTable");
      tbody.innerHTML = "";
      dados.forEach(municipio => {
        const contribuicao = calcularContribuicao(municipio.populacao);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="p-3 border-b">${municipio.nome}</td>
          <td class="p-3 border-b">${formatarNumero(municipio.populacao)}</td>
          <td class="p-3 border-b">${formatarNumero(contribuicao)}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // Função de busca
    document.getElementById("searchInput").addEventListener("input", function () {
      const filtro = this.value.toLowerCase();
      const filtrados = municipios.filter(municipio =>
        municipio.nome.toLowerCase().includes(filtro)
      );
      preencherTabela(filtrados);
    });

    // Inicializar tabela com todos os dados
    preencherTabela(municipios);
  </script>
